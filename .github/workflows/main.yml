name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: webapp

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias y cobertura
        run: npm test

      - name: Resumen de cobertura
        run: |
          echo "==== Code Coverage (umbral minimo 70%) ===="
          if [ -f coverage/lcov-report/index.html ]; then
            echo "Reporte HTML generado en coverage/"
          fi
          # El umbral se valida dentro de Jest (coverageThreshold)

  build-and-push:
    name: Build y Push Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy a AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest"
            echo "Descargando imagen: $IMAGE"
            sudo docker pull "$IMAGE"
            sudo docker rm -f webapp-container || true
            sudo docker run -d \
              --name webapp-container \
              --restart unless-stopped \
              -p 80:80 \
              -p 6061:6061 \
              "$IMAGE"
            echo "Despliegue listo"
            sudo docker ps --filter name=webapp-container
